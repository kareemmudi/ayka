<h2>AYKA Test - Firebase + Email</h2>
<button onclick="testAll()">جرب الطلب دلوقتي</button>
<pre id="log">اضغط الزرار...</pre>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwd3MwP00PkRV8O3hIhF01YQR6dgm6q4KAaqwx2VVyci34K7eiM88a5_DfBklo7QpE-/exec";
const EMAIL = "kareemmudiii@gmail.com";
const firebaseConfig = {
  apiKey: "AIzaSyDHUz4jutb7Bx44RIrAWnX_fUdQJoQ7lH4",
  authDomain: "ayka-store.firebaseapp.com",
  projectId: "ayka-store",
  storageBucket: "ayka-store.firebasestorage.app",
  messagingSenderId: "651495721516",
  appId: "1:651495721516:web:543303c84e4b3a2ff45f89"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function log(m){ document.getElementById('log').textContent += "\n" + m; console.log(m); }

async function testAll(){
  document.getElementById('log').textContent = 'بيجرب...';
  let order = {
    id: 'AYKA-TEST-' + Date.now().toString().slice(-5),
    customerName: 'Test Kareem',
    name: 'Test Kareem',
    phone: '01000000000',
    address: 'Test Address',
    total: 100,
    items: [{name:'Test Product', qty:1}],
    date: new Date().toISOString()
  };
  
  // 1 - Firebase
  try{
    await db.collection('ayka_orders').doc(order.id).set({...order, cloudAt: firebase.firestore.FieldValue.serverTimestamp()});
    log('✅ Firebase شغال - الطلب اتحفظ: ' + order.id);
  }catch(e){ log('❌ Firebase بايظ: ' + e.message); }

  // 2 - GAS
  try{
    await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'saveOrder', order: order, email: EMAIL})});
    log('✅ GAS اتبعت - المفروض يجي ايميل من جوجل شيت لو ال Authorization معمول');
  }catch(e){ log('❌ GAS بايظ: ' + e.message); }

  // 3 - FormSubmit
  try{
    let fd = new FormData();
    fd.append('الاسم', order.customerName);
    fd.append('الموبايل', order.phone);
    fd.append('رقم الطلب', order.id);
    fd.append('_subject', 'TEST AYKA ' + order.id);
    fd.append('_captcha', 'false');
    let res = await fetch('https://formsubmit.co/ajax/' + EMAIL, {method:'POST', body: fd});
    let txt = await res.text();
    log('✅ FormSubmit اتبعت - الرد: ' + txt.slice(0,200));
    log('لو اول مرة لازم تفتح ايميلك وتدوس Confirm في ايميل من FormSubmit');
  }catch(e){ log('❌ FormSubmit بايظ: ' + e.message); }

  log('\nخلص - شوف Firebase فيه ' + order.id + ' ولا لأ، وشوف ايميلك');
}
</script>
